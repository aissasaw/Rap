<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AISSASAW RAP</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Tajawal:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Tajawal',sans-serif;overflow:hidden}
.camera{height:100vh;width:100vw;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
.camera img.bg{position:absolute;width:100%;height:100%;object-fit:cover;opacity:.45;filter:blur(1px) brightness(.7)}
.vignette{position:absolute;width:100%;height:100%;background:radial-gradient(circle, transparent 40%, black 95%);z-index:1}
.viewfinder{position:absolute;width:92%;height:88%;border:2px solid rgba(255,255,255,.2);z-index:2;pointer-events:none}
.viewfinder::before{content:'REC ●';position:absolute;top:15px;left:15px;color:#ff0000;font-family:'Bebas Neue';letter-spacing:2px;font-size:18px;animation:blink 1s infinite}
.viewfinder::after{content:'AISSASAW RAP / AIN ARNAT';position:absolute;bottom:15px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;letter-spacing:4px;opacity:.7}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.content{position:relative;z-index:3;text-align:center}
.content img.profile{width:220px;height:220px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 60px rgba(255,255,255,.5);object-fit:cover}
.content h1{font-family:'Bebas Neue';font-size:75px;margin-top:20px;letter-spacing:3px}
.content h1 span{color:#888}
.links{margin-top:20px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.links a{width:50px;height:50px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;text-decoration:none;transition:.3s}
.links a:hover{background:#fff;color:#000}
</style>
</head>
<body>
<div class="camera">
<img src="profile.jpg" class="bg" alt="bg">
<div class="vignette"></div>
<div class="viewfinder"></div>
<div class="content">
<img src="profile.jpg" class="profile" alt="AISSASAW">
<h1>AISSASAW <span>RAP</span></h1>
<div class="links">
<a href="https://www.youtube.com/@aissasaw" target="_blank"><i class="fab fa-youtube"></i></a>
<a href="https://www.instagram.com/aissasaw_rap" target="_blank"><i class="fab fa-instagram"></i></a>
<a href="https://www.tiktok.com/@aissasaw1" target="_blank"><i class="fab fa-tiktok"></i></a>
<a href="https://www.facebook.com/share/1DYnDEacpH/" target="_blank"><i class="fab fa-facebook"></i></a>
<a href="https://www.facebook.com/share/1Bv1tgjdvr/" target="_blank"><i class="fas fa-user"></i></a>
</div>
</div>
</div>
</body>
</html>
