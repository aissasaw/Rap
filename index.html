<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AISSA SAW</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial, Tahoma;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;background:url('bg.jpg') center top / cover no-repeat;filter:brightness(0.25);z-index:0}
.content{position:relative;z-index:2;padding:20px;width:100%;max-width:450px;display:flex;flex-direction:column;align-items:center}
.photo{width:140px;height:140px;border-radius:50%;border:3px solid #ff0000;object-fit:cover;margin-bottom:20px;box-shadow:0 0 30px rgba(255,0,0,0.5)}
h1{font-size:52px;font-weight:900;letter-spacing:2px;margin-bottom:15px;font-family:'Arial Black';}
h1 span{color:#ff0000}
.arabic{font-size:20px;margin-bottom:10px;opacity:0.95;line-height:1.5}
.info{font-size:16px;opacity:0.7;margin-bottom:4px}
.domain{font-size:16px;opacity:0.7;margin-bottom:30px;direction:ltr}
.btn{width:85%;padding:16px;border-radius:50px;border:none;font-size:18px;font-weight:bold;cursor:pointer;margin-bottom:15px;transition:0.3s;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-red{background:#e50914;color:#fff}
.btn-red:hover{background:#ff0000;transform:scale(1.03)}
.btn-white{background:#fff;color:#000}
.btn-white:hover{transform:scale(1.03)}
.social{margin-top:25px;display:flex;gap:18px}
.social a{width:45px;height:45px;background:rgba(255,255,255,0.1);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;text-decoration:none}
.social a:hover{background:#fff;color:#000}
</style>
</head>
<body>
<div class="bg"></div>
<div class="content">
  <img src="bg.jpg" class="photo" alt="Aissa Saw">
  <h1>AISSA <span>SAW</span></h1>
  <div class="arabic">عيسى صاو - مغني راب، كاتب أغاني</div>
  <div class="info">26 أوت 1983 - سيدي عيسى، المسيلة -</div>
  <div class="domain">aissasaw.is-a.dev</div>
  
  <a href="https://www.youtube.com/@aissasaw" class="btn btn-red">🎬 شاهد الكليبات</a>
  <a href="https://www.youtube.com/@aissasaw" class="btn btn-white">YouTube</a>
  
  <div class="social">
    <a href="https://instagram.com/" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://tiktok.com/" target="_blank"><i class="fab fa-tiktok"></i></a>
    <a href="https://soundcloud.com/" target="_blank"><i class="fab fa-soundcloud"></i></a>
    <a href="https://youtube.com/" target="_blank"><i class="fab fa-youtube"></i></a>
  </div>
</div>
</body>
</html>
