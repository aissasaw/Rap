<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AISSA SAW - Official</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial, sans-serif}
.hero{position:relative;height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.hero .bg{position:absolute;inset:0;background:url('profile.jpg') center/cover no-repeat;filter:brightness(0.4)}
.hero .content{position:relative;z-index:2}
.hero h1{font-family:'Arial Black';font-size:14vw;line-height:0.9;letter-spacing:5px}
.hero h1 span{color:#ff1a1a;display:block;font-size:22vw;opacity:0.8}
.hero p{letter-spacing:8px;opacity:0.7;margin-top:15px}
section{padding:50px 20px;max-width:900px;margin:auto}
h2{font-family:'Arial Black';font-size:32px;margin-bottom:20px;border-left:4px solid #ff1a1a;padding-left:15px}
.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
.video-grid iframe{width:100%;height:180px;border-radius:12px;border:none}
.music-box{background:#111;border-radius:16px;padding:15px;border:1px solid #222}
footer{text-align:center;padding:30px;opacity:0.5;font-size:13px}
.social{margin:20px 0;display:flex;gap:15px;justify-content:center}
.social a{color:#fff;text-decoration:none;background:#222;padding:10px 18px;border-radius:20px}
</style>
</head>
