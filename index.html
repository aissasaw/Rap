<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>AISSASAW RAP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;text-align:center}
.hero{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:50px 20px}
h1{font-size:70px;font-weight:900;letter-spacing:8px;line-height:1}
.rap{color:#808080;font-size:110px;display:block;letter-spacing:15px;margin-top:5px}
.sub{color:#555;letter-spacing:10px;margin-top:15px}
.btn{margin-top:25px;padding:12px 30px;border:1px solid #808080;color:#fff;text-decoration:none;border-radius:30px;display:inline-block}
.videos{background:#0f0f0f;padding:50px 20px}
.videos h2{color:#808080;font-size:30px;letter-spacing:6px;margin-bottom:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;max-width:1100px;margin:0 auto}
.grid iframe{width:100%;height:200px;border-radius:15px;border:1px solid #333}

</head>
